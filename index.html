<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>sensor-mock test</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"/>
</head>
<body>
<div id="map" style="height: 600px"></div>

<script type="module">
  import {enableSensorMock} from "/dist/index.js";
  enableSensorMock({
    serverUrl: "https://sensor-sim.h9e.de",
    shareToken: "WwPzyWgGkCzGBNNBg4dLOQAAAAgAAAABAaEQiRly",
    overlay: true,
  });
</script>


<script type="module">
  import * as ml from 'https://unpkg.com/maplibre-gl/dist/maplibre-gl.mjs';

  const map = new ml.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/positron',
    center: [10.52, 52.26],
    zoom: 12
  });
  map.addControl(new ml.GeolocateControl({
    positionOptions: {enableHighAccuracy: true},
    trackUserLocation: true,
  }));

</script>

</body>
</html>
